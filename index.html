<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простой калькулятор калорий с активностью</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }

        .calculator-card {
            background-color: #ffffff;
            width: 380px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .nav-bar {
            background-color: #24b824;
            display: flex;
            justify-content: space-around;
            padding: 12px 6px;
        }

        .nav-item {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .nav-item:hover {
            opacity: 0.8;
        }

        .form-container {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .input-row {
            display: flex;
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .input-label {
            color: #555555;
            font-size: 13px;
            font-weight: 600;
        }

        .input-field, .select-field {
            background-color: #e0e0e0;
            border: none;
            padding: 10px 12px;
            font-size: 15px;
            border-radius: 2px;
            outline: none;
            color: #333333;
            box-sizing: border-box;
            width: 100%;
        }

        input[type="number"].input-field {
            background-image: linear-gradient(45deg, #dbdbdb 25%, transparent 25%, transparent 50%, #dbdbdb 50%, #dbdbdb 75%, transparent 75%, transparent);
            background-size: 4px 4px;
        }

        input[type="number"].input-field:focus {
            background-image: none;
            background-color: #d5d5d5;
        }

        .submit-btn {
            background-color: #24b824;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 2px;
            margin-top: 8px;
            align-self: flex-start;
            padding-left: 24px;
            padding-right: 24px;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #1e9c1e;
        }

        .result-box {
            margin-top: 15px;
            padding: 15px;
            color: #333333;
            border-radius: 4px;
            display: none; 
            box-sizing: border-box;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .result-box.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        .result-box p {
            margin: 6px 0;
            font-size: 14px;
        }

        .result-title {
            font-size: 16px !important;
            font-weight: bold;
            margin-bottom: 8px !important;
        }

        .image-container {
            margin-top: 12px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .status-good {
            background-color: #e8f8e8;
            border-left: 5px solid #24b824;
        }
        .status-good .highlight { color: #24b824; font-weight: bold; }

        .status-bad {
            background-color: #f8d7da;
            border-left: 5px solid #dc3545;
        }
        .status-bad .highlight { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>

    <div class="calculator-card">
        
        <nav class="nav-bar">
            <a href="#" class="nav-item">Главная</a>
            <a href="https://example.com" target="_blank" rel="noopener noreferrer" class="nav-item">Рецепты</a>
            <a href="https://example.com" target="_blank" rel="noopener noreferrer" class="nav-item">Тренировки</a>
        </nav>

        <div class="form-container">
            
            <!-- Пол и Возраст -->
            <div class="input-row">
                <div class="input-group">
                    <span class="input-label">Пол</span>
                    <select id="gender" class="select-field">
                        <option value="male">Мужской</option>
                        <option value="female">Женский</option>
                    </select>
                </div>
                <div class="input-group">
                    <span class="input-label">Возраст (лет)</span>
                    <input type="number" id="age" class="input-field" min="14" max="90" value="25" required>
                </div>
            </div>

            <!-- Рост и Вес -->
            <div class="input-row">
                <div class="input-group">
                    <span class="input-label">Рост (см)</span>
                    <input type="number" id="height" class="input-field" min="100" max="250" required>
                </div>
                <div class="input-group">
                    <span class="input-label">Вес (кг)</span>
                    <input type="number" id="weight" class="input-field" min="30" max="300" required>
                </div>
            </div>

            <!-- ВОТ ЭТОТ БЛОК ТЕПЕРЬ ОТОБРАЖАЕТСЯ НА ЭКРАНЕ (Образ жизни) -->
            <div class="input-group">
                <span class="input-label">Образ жизни / Активность</span>
                <select id="activity" class="select-field">
                    <option value="1.2">Сидячий (работа за компьютером, мало движений)</option>
                    <option value="1.375">Легкий (пешие прогулки или спорт 1-3 раза в неделю)</option>
                    <option value="1.55">Средний (интенсивные тренировки 3-5 раз в неделю)</option>
                    <option value="1.725">Тяжелый (тяжелый физический труд или ежедневный спорт)</option>
                </select>
            </div>

            <!-- Цель -->
            <div class="input-group">
                <span class="input-label">Ваша цель</span>
                <select id="goal" class="select-field">
                    <option value="lose">Похудение (дефицит калорий)</option>
                    <option value="maintain">Поддержание текущего веса</option>
                    <option value="gain">Набор массы (профицит калорий)</option>
                </select>
            </div>

            <!-- Съеденные калории -->
            <div class="input-group">
                <span class="input-label">Сколько ккал съедено за сегодня?</span>
                <input type="number" id="eaten" class="input-field" min="0" max="10000" placeholder="0" required>
            </div>

            <button type="button" class="submit-btn" onclick="calculateNorm()">Сравнить результаты</button>

            <!-- Блок результатов -->
            <div id="result" class="result-box">
                <p class="result-title" id="res-title">Итоги дня</p>
                <p>Целевая суточная норма: <span id="res-norm" class="highlight">0</span> ккал</p>
                <p>Вы съели: <span id="res-eaten" class="highlight">0</span> ккал</p>
                <p id="res-text">Всё в порядке!</p>
                
                <div class="image-container">
                    <img id="result-image" src="" alt="Результат питания">
                </div>
            </div>

        </div>

    </div>
<script>
    function calculateNorm() {
        const gender = document.getElementById('gender').value;
        const age = parseFloat(document.getElementById('age').value);
        const height = parseFloat(document.getElementById('height').value);
        const weight = parseFloat(document.getElementById('weight').value);
        const activity = parseFloat(document.getElementById('activity').value);
        const goal = document.getElementById('goal').value;
        const eaten = parseFloat(document.getElementById('eaten').value) || 0;
        
        const resultBox = document.getElementById('result');
        const imgElement = document.getElementById('result-image');

        if (!height || !weight || !age || height <= 0 || weight <= 0 || age <= 0) {
            alert("Пожалуйста, заполните корректно все поля.");
            return;
        }

        // 1. Расчет базового обмена веществ (БОВ) по формуле Миффлина - Сан Жеора
        let bmr = 0;
        if (gender === 'male') {
            bmr = (10 * weight) + (6.25 * height) - (5 * age) + 5;
        } else {
            bmr = (10 * weight) + (6.25 * height) - (5 * age) - 161;
        }

        // 2. Применение выбранного коэффициента активности (образа жизни)
        let maintenanceCalories = bmr * activity;
        let targetCalories = Math.round(maintenanceCalories);

        // 3. Корректировка калорий под фитнес-цель
        if (goal === 'lose') {
            targetCalories = Math.round(maintenanceCalories * 0.85); // Дефицит 15%
        } else if (goal === 'gain') {
            targetCalories = Math.round(maintenanceCalories * 1.10); // Профицит 10%
        }

        resultBox.className = "result-box"; 
        let title = "";
        let text = "";
        let statusClass = "";
        let chosenImage = "";

        const randomNum = Math.floor(Math.random() * 3) + 1;
        const diff = eaten - targetCalories;

        if (Math.abs(diff) <= 150) {
            title = "Идеальное попадание!";
            text = "Вы отлично придерживаетесь плана питания для выбранной цели.";
            statusClass = "status-good";
            chosenImage = `success${randomNum}.png`;
        } else if (diff < -150) {
            if (goal === 'lose') {
                title = "Отличный дефицит!";
                text = `Вы съели на ${Math.abs(diff)} ккал меньше нормы. Прекрасный темп для сброса веса.`;
                statusClass = "status-good";
                chosenImage = `success${randomNum}.png`;
            } else {
                title = "Слишком сильный дефицит";
                text = `Вы недобрали до цели ${Math.abs(diff)} ккал. Для вашей задачи нужно есть больше.`;
                statusClass = "status-bad";
                chosenImage = `fail${randomNum}.png`;
            }
        } else {
            if (goal === 'gain') {
                title = "Хороший профицит!";
                text = `Превышение нормы на ${diff} ккал. То что нужно для качественного роста массы.`;
                statusClass = "status-good";
                chosenImage = `success${randomNum}.png`;
            } else {
                title = "Норма превышена!";
                text = `Вы съехали с плана на ${diff} ккал. Постарайтесь завтра вернуться в рамки нормы.`;
                statusClass = "status-bad";
                chosenImage = `fail${randomNum}.png`;
            }
        }

        document.getElementById('res-title').innerText = title;
        document.getElementById('res-norm').innerText = targetCalories;
        document.getElementById('res-eaten').innerText = eaten;
        document.getElementById('res-text').innerText = text;

        imgElement.src = chosenImage;

        resultBox.classList.add(statusClass);
        resultBox.style.display = 'block';
        setTimeout(() => {
            resultBox.classList.add('show');
        }, 10);
    }
</script>
